<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>My Notes Manager</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --accent: #8b5cf6;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --text: #172033;
  --muted: #697386;
  --border: #dfe4ec;
  --shadow: 0 4px 12px rgba(99,102,241,.15);
  --shadow-lg: 0 12px 32px rgba(99,102,241,.25);
  --radius: 14px;
}
body.dark {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-2: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #334155;
  --shadow: 0 4px 12px rgba(0,0,0,.3);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
}
body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 90px;
  transition: background .3s, color .3s;
  -webkit-user-select: none;
  user-select: none;
  font-size: 15px;
}
body.dark {
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
}
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
button:active { transform: scale(.96); }

/* ═══ LOADING SCREEN ═══ */
#loader {
  position: fixed; inset: 0; z-index: 99999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
  color: #fff; transition: opacity .5s, visibility .5s;
}
#loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
#loader .icon { font-size: 68px; margin-bottom: 18px; animation: bounce 2.4s ease-in-out infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
#loader h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.5px; }
#loader .status { font-size: 13px; opacity: .9; margin-bottom: 22px; font-weight: 500; min-height: 18px; }
#loader .bar-wrap { width: 240px; height: 6px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; }
#loader .bar { height: 100%; width: 0%; background: #fff; border-radius: 99px; transition: width .4s ease; }
#loader .pct { margin-top: 10px; font-size: 12px; font-weight: 700; letter-spacing: .5px; }

/* ═══ APP LAYOUT ═══ */
.app { max-width: 640px; margin: 0 auto; padding: 12px; }

/* ═══ HEADER ═══ */
.header {
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
  border: 1px solid rgba(255,255,255,.5);
  box-shadow: var(--shadow);
}
body.dark .header {
  background: rgba(30,41,59,.85);
  border-color: rgba(255,255,255,.1);
}
.header .logo { font-size: 24px; }
.header .title { flex: 1; font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
.header .sync-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--muted); flex: none;
  transition: background .3s;
}
.header .sync-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.header .sync-dot.offline { background: #dc2626; }
.header .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .4; } }
.header button {
  width: 40px; height: 40px; border-radius: 12px;
  background: rgba(255,255,255,.5);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; transition: .2s;
}
body.dark .header button { background: rgba(255,255,255,.06); }
.header button:hover { background: rgba(99,102,241,.15); }

/* ═══ SEARCH + FILTERS ═══ */
.controls {
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(20px);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,.5);
  box-shadow: var(--shadow);
  display: flex; gap: 8px; align-items: center;
}
body.dark .controls { background: rgba(30,41,59,.85); border-color: rgba(255,255,255,.1); }
.search-box { flex: 1; position: relative; }
.search-box input {
  width: 100%; height: 40px; padding: 0 14px 0 38px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface-2); color: var(--text);
  font-size: 14px; outline: none; transition: .2s;
}
body.dark .search-box input { background: rgba(255,255,255,.06); }
.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.search-box .icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 14px; opacity: .5; pointer-events: none;
}
.filter-btn {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: .2s;
}
body.dark .filter-btn { background: rgba(255,255,255,.06); }
.filter-btn.on { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border-color: transparent; }

/* ═══ TABS ═══ */
.tabs {
  display: flex; gap: 6px; margin-bottom: 12px;
  overflow-x: auto; padding-bottom: 2px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 16px; border-radius: 12px;
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(255,255,255,.5);
  font-size: 13px; font-weight: 700; white-space: nowrap;
  color: var(--text); transition: .2s;
  display: flex; align-items: center; gap: 6px;
}
body.dark .tab { background: rgba(30,41,59,.7); border-color: rgba(255,255,255,.1); }
.tab.on { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border-color: transparent; box-shadow: var(--shadow); }
.tab .count {
  background: rgba(0,0,0,.15); padding: 1px 6px;
  border-radius: 8px; font-size: 11px; font-weight: 800;
}
.tab.on .count { background: rgba(255,255,255,.25); }

/* ═══ NOTES LIST ═══ */
.notes { display: flex; flex-direction: column; gap: 10px; }
.note {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: all .18s cubic-bezier(.22,1,.36,1);
  display: flex; gap: 12px; align-items: flex-start;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
  animation: slideIn .3s ease backwards;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
.note:active { transform: scale(.985); box-shadow: var(--shadow-lg); }
.note .color-bar {
  width: 4px; align-self: stretch; border-radius: 4px;
  background: var(--primary); flex: none;
}
.note .content { flex: 1; min-width: 0; }
.note .title {
  font-size: 15.5px; font-weight: 700; line-height: 1.3;
  margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
  word-break: break-word;
}
.note .title .pin { color: var(--danger); font-size: 13px; flex: none; }
.note .title .fav { color: #eab308; font-size: 13px; flex: none; }
.note .preview {
  font-size: 13px; color: var(--muted); line-height: 1.5;
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  word-break: break-word;
}
.note .meta {
  font-size: 11px; color: var(--muted); margin-top: 8px;
  display: flex; gap: 12px; align-items: center;
}
.note .actions {
  display: flex; gap: 2px; flex-direction: column;
  align-items: center; flex: none;
}
.note .actions button {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--muted);
  transition: .15s;
}
.note .actions button:hover { background: rgba(99,102,241,.15); }
.note .actions button.fav-on { color: #eab308; }
.note .actions button.pin-on { color: var(--danger); }

/* ═══ EMPTY ═══ */
.empty {
  text-align: center; padding: 60px 24px;
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(20px);
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,.5);
  box-shadow: var(--shadow);
}
body.dark .empty { background: rgba(30,41,59,.7); border-color: rgba(255,255,255,.1); }
.empty .icon { font-size: 72px; opacity: .5; margin-bottom: 16px; }
.empty h2 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.empty p { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; max-width: 320px; margin-left: auto; margin-right: auto; }
.empty button {
  padding: 12px 24px; border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff; font-size: 14px; font-weight: 700;
  box-shadow: var(--shadow-lg);
}

/* ═══ FAB ═══ */
.fab {
  position: fixed; bottom: 20px; right: 20px; z-index: 200;
  width: 60px; height: 60px; border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff; font-size: 30px; border: 0;
  box-shadow: 0 8px 24px rgba(99,102,241,.5);
  display: flex; align-items: center; justify-content: center;
  transition: .2s;
}
.fab:active { transform: scale(.9); }

/* ═══ EDITOR ═══ */
.editor-bg {
  position: fixed; inset: 0; z-index: 5000;
  background: rgba(15,23,42,.55);
  backdrop-filter: blur(8px);
  display: none; align-items: flex-end; justify-content: center;
}
.editor-bg.show { display: flex; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.editor {
  width: 100%; max-width: 640px; height: 94vh;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  display: flex; flex-direction: column;
  animation: slideUp .3s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.editor .head {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.editor .head button {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; transition: .15s;
}
.editor .head button:hover { background: var(--surface-2); }
.editor .head .save {
  width: auto; padding: 0 18px; height: 38px; border-radius: 19px;
  background: linear-gradient(135deg, var(--success), #059669);
  color: #fff; font-size: 13px; font-weight: 800;
  box-shadow: 0 4px 12px rgba(16,185,129,.4);
}
.editor .head .title { flex: 1; font-size: 15px; font-weight: 800; }
.editor .body {
  flex: 1; overflow-y: auto; padding: 18px;
  display: flex; flex-direction: column; gap: 16px;
}
.editor .field label {
  display: block; font-size: 11px; font-weight: 800;
  color: var(--primary); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 6px;
}
.editor input[type="text"] {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface-2); color: var(--text);
  font-size: 16px; font-weight: 700; outline: none;
  transition: .2s;
}
.editor input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.editor .rich {
  min-height: 240px; padding: 14px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface-2); color: var(--text);
  font-size: 15px; line-height: 1.7; outline: none;
  transition: .2s;
}
.editor .rich:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.editor .rich:empty:before { content: attr(data-ph); color: var(--muted); }
.editor .toolbar {
  display: flex; gap: 4px; flex-wrap: wrap;
  padding: 8px 0; border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.editor .toolbar button {
  min-width: 36px; height: 36px; padding: 0 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 14px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; justify-content: center; gap: 4px;
  transition: .15s;
}
.editor .toolbar button:hover { background: rgba(99,102,241,.15); }
.editor .colors { display: flex; gap: 8px; flex-wrap: wrap; }
.editor .sw {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer;
  transition: .15s; flex: none;
}
.editor .sw:hover { transform: scale(1.1); }
.editor .sw.on { border-color: var(--text); box-shadow: 0 0 0 3px var(--surface); }

/* ═══ TOAST ═══ */
#toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1e1b4b; color: #fff;
  padding: 12px 20px; border-radius: 12px;
  font-size: 13.5px; font-weight: 600;
  z-index: 9999; opacity: 0; pointer-events: none;
  transition: all .3s; max-width: calc(100vw - 40px);
  text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,.4);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--danger); }
#toast.success { background: var(--success); }

/* ═══ ERROR BOX ═══ */
#err-box {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 999999;
  background: var(--danger); color: #fff;
  padding: 14px 40px 14px 16px;
  font-size: 12px; font-family: ui-monospace, monospace;
  line-height: 1.5; display: none;
  max-height: 40vh; overflow-y: auto;
  white-space: pre-wrap; word-break: break-all;
}
#err-box.show { display: block; }
#err-box .x {
  position: absolute; top: 10px; right: 14px;
  font-size: 22px; font-weight: 700; cursor: pointer;
}

/* ═══ BOTTOM NAV ═══ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: none;
  padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto;
}
body.dark .bottom-nav { background: rgba(30,41,59,.95); }
.bottom-nav.show { display: flex; }
.bottom-nav button {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px; padding: 6px;
  color: var(--muted); font-size: 10px; font-weight: 700;
  transition: color .15s;
}
.bottom-nav button.on { color: var(--primary); }
.bottom-nav button .ico { font-size: 20px; }

@media (min-width: 700px) {
  .app { padding: 20px; }
}
</style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="icon">📝</div>
  <h1>My Notes</h1>
  <div class="status" id="loadStatus">Connecting...</div>
  <div class="bar-wrap"><div class="bar" id="loadBar"></div></div>
  <div class="pct" id="loadPct">0%</div>
</div>

<!-- Error box -->
<div id="err-box"><span class="x" onclick="hideErr()">×</span><span id="errMsg"></span></div>

<!-- App -->
<div class="app" id="app" style="display:none;">

  <div class="header">
    <div class="logo">📝</div>
    <div class="title">My Notes</div>
    <span class="sync-dot" id="syncDot"></span>
    <button onclick="toggleTheme()" id="themeBtn" title="Theme">🌙</button>
    <button onclick="reloadCloud()" title="Sync">🔄</button>
    <button onclick="signOutNow()" title="Logout">🚪</button>
  </div>

  <div class="controls">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="search" id="search" placeholder="Search notes..." oninput="render()">
    </div>
    <button class="filter-btn" id="favBtn" onclick="toggleFavFilter()" title="Favorites only">⭐</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="all" onclick="setTab('all')">📒 All <span class="count" id="cntAll">0</span></button>
    <button class="tab" data-tab="pinned" onclick="setTab('pinned')">📌 Pinned <span class="count" id="cntPinned">0</span></button>
    <button class="tab" data-tab="trash" onclick="setTab('trash')">🗑 Bin <span class="count" id="cntTrash">0</span></button>
  </div>

  <div class="notes" id="notes"></div>

</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openEditor()" style="display:none;">＋</button>

<!-- Editor -->
<div class="editor-bg" id="editorBg" onclick="if(event.target===this)closeEditor()">
  <div class="editor">
    <div class="head">
      <button onclick="closeEditor()">✕</button>
      <div class="title" id="edTitle">New Note</div>
      <button class="save" onclick="saveNote()">Save</button>
    </div>
    <div class="body">
      <div class="field">
        <label>Title</label>
        <input type="text" id="edInput" placeholder="Note title...">
      </div>
      <div class="field">
        <label>Content</label>
        <div class="rich" id="edBody" contenteditable="true" data-ph="Write your note here..."></div>
      </div>
      <div class="toolbar">
        <button onclick="fmt('bold')" style="font-weight:900">B</button>
        <button onclick="fmt('italic')" style="font-style:italic">I</button>
        <button onclick="fmt('underline')" style="text-decoration:underline">U</button>
        <button onclick="fmt('strikeThrough')" style="text-decoration:line-through">S</button>
        <button onclick="fmt('insertUnorderedList')">• List</button>
        <button onclick="fmt('insertOrderedList')">1. List</button>
        <button onclick="fmt('formatBlock','H2')">H</button>
        <button onclick="fmt('removeFormat')">🧹</button>
      </div>
      <div class="field">
        <label>Color</label>
        <div class="colors" id="colors"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav" id="bottomNav">
  <button class="on" onclick="setTab('all');scrollTop()"><span class="ico">📒</span><span>Notes</span></button>
  <button onclick="openEditor()"><span class="ico">➕</span><span>New</span></button>
  <button onclick="toggleFavFilter()"><span class="ico">⭐</span><span>Favorites</span></button>
  <button onclick="toggleTheme()"><span class="ico" id="navTheme">🌙</span><span>Theme</span></button>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ═══════════════════════════════════════════
// CONFIG — Aapka Firebase project
// ═══════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyASsp2ZuTigb13el83OSafe-kVbKcX8rGM",
  authDomain: "notes-manager-fedd0.firebaseapp.com",
  projectId: "notes-manager-fedd0",
  storageBucket: "notes-manager-fedd0.firebasestorage.app",
  messagingSenderId: "814688034472",
  appId: "1:814688034472:web:227c5b1d9b3b22346a6c9d"
};

const EMAIL = "notemanager.app@gmail.com";
const PASS = "NoteMgr@2026Secure";
const COLL = "my_notes_manager";

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let notes = [];
let currentUser = null;
let editingId = null;
let currentColor = "#6366f1";
let currentTab = "all";
let favOnly = false;
let saveTimer = null;
let saving = false;

const COLORS = ["#6366f1", "#8b5cf6", "#ec4899", "#ef4444", "#f59e0b", "#10b981", "#06b6d4", "#64748b"];

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function $(id) { return document.getElementById(id); }
function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function stripTags(h) { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent || ""; }
function relTime(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60); if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60); if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24); if (d < 30) return d + "d ago";
  return new Date(ts).toLocaleDateString();
}

// ═══════════════════════════════════════════
// ERROR / TOAST
// ═══════════════════════════════════════════
window.showErr = m => {
  $("errMsg").textContent = "❌ " + m;
  $("err-box").classList.add("show");
  console.error(m);
};
window.hideErr = () => $("err-box").classList.remove("show");
window.addEventListener("error", e => showErr(e.message));
window.addEventListener("unhandledrejection", e => showErr(e.reason?.message || String(e.reason)));

function toast(m, t) {
  const el = $("toast");
  el.textContent = m;
  el.className = t || "";
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2000);
}
function setSync(s) { $("syncDot").className = "sync-dot " + s; }
function setProgress(pct, msg) {
  const bar = $("loadBar"), p = $("loadPct"), s = $("loadStatus");
  if (bar) bar.style.width = pct + "%";
  if (p) p.textContent = pct + "%";
  if (s && msg) s.textContent = msg;
}
function hideLoader() {
  setProgress(100, "Ready");
  const l = $("loader");
  if (l) {
    l.classList.add("hide");
    setTimeout(() => l.style.display = "none", 600);
  }
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
window.setTab = function(t) {
  currentTab = t;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  render();
};

window.toggleFavFilter = function() {
  favOnly = !favOnly;
  $("favBtn").classList.toggle("on", favOnly);
  render();
};

window.render = function() {
  const q = ($("search").value || "").toLowerCase().trim();
  const list = $("notes");

  let items = notes.slice();
  if (currentTab === "trash") items = items.filter(n => n.deleted);
  else items = items.filter(n => !n.deleted);
  if (currentTab === "pinned") items = items.filter(n => n.pinned);
  if (favOnly) items = items.filter(n => n.fav);

  if (q) items = items.filter(n =>
    (n.title || "").toLowerCase().includes(q) ||
    stripTags(n.content).toLowerCase().includes(q)
  );

  items.sort((a, b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return new Date(b.updated || b.created || 0) - new Date(a.updated || a.created || 0);
  });

  // Counts
  $("cntAll").textContent = notes.filter(n => !n.deleted).length;
  $("cntPinned").textContent = notes.filter(n => !n.deleted && n.pinned).length;
  $("cntTrash").textContent = notes.filter(n => n.deleted).length;

  if (!items.length) {
    const msg = q ? "No results for search" :
                currentTab === "trash" ? "Bin is empty" :
                currentTab === "pinned" ? "No pinned notes" :
                favOnly ? "No favorites" :
                "No notes yet";
    const sub = q ? "Try different words." :
                currentTab === "trash" ? "Deleted notes appear here." :
                currentTab === "pinned" ? "Pin important notes to find them fast." :
                favOnly ? "Tap ☆ on any note to mark as favorite." :
                "Tap the + button to create your first note.";
    list.innerHTML = '<div class="empty"><div class="icon">' +
      (q ? "🔍" : currentTab === "trash" ? "🗑" : currentTab === "pinned" ? "📌" : favOnly ? "⭐" : "📝") +
      '</div><h2>' + msg + '</h2><p>' + sub + '</p>' +
      (!q && currentTab === "all" ? '<button onclick="openEditor()">✏️ Create First Note</button>' : '') +
      '</div>';
    return;
  }

  list.innerHTML = items.map(n => {
    const preview = stripTags(n.content).slice(0, 140) || "Empty note";
    return '<div class="note" onclick="' + (n.deleted ? 'restoreNote' : 'editNote') + '(\'' + n.id + '\')">' +
      '<div class="color-bar" style="background:' + (n.color || "#6366f1") + '"></div>' +
      '<div class="content">' +
        '<div class="title">' +
          (n.pinned ? '<span class="pin">📌</span>' : '') +
          (n.fav ? '<span class="fav">⭐</span>' : '') +
          escapeHtml(n.title || "Untitled") +
        '</div>' +
        '<div class="preview">' + escapeHtml(preview) + '</div>' +
        '<div class="meta"><span>🕐 ' + relTime(n.updated || n.created) + '</span></div>' +
      '</div>' +
      '<div class="actions">' +
        (!n.deleted ?
          '<button class="' + (n.fav ? "fav-on" : "") + '" onclick="event.stopPropagation();toggleFav(\'' + n.id + '\')" title="Favorite">' + (n.fav ? "⭐" : "☆") + '</button>' +
          '<button class="' + (n.pinned ? "pin-on" : "") + '" onclick="event.stopPropagation();togglePin(\'' + n.id + '\')" title="Pin">📌</button>' +
          '<button onclick="event.stopPropagation();delNote(\'' + n.id + '\')" title="Delete">🗑️</button>'
        :
          '<button onclick="event.stopPropagation();restoreNote(\'' + n.id + '\')" title="Restore">↩️</button>' +
          '<button onclick="event.stopPropagation();permDelete(\'' + n.id + '\')" title="Delete Forever">❌</button>'
        ) +
      '</div>' +
    '</div>';
  }).join("");
};

window.scrollTop = () => window.scrollTo({ top: 0, behavior: "smooth" });

// ═══════════════════════════════════════════
// EDITOR
// ═══════════════════════════════════════════
window.openEditor = function() {
  editingId = null;
  currentColor = "#6366f1";
  $("edTitle").textContent = "New Note";
  $("edInput").value = "";
  $("edBody").innerHTML = "";
  renderColors();
  $("editorBg").classList.add("show");
  setTimeout(() => $("edInput").focus(), 300);
};

window.editNote = function(id) {
  const n = notes.find(x => x.id === id);
  if (!n || n.deleted) return;
  editingId = id;
  currentColor = n.color || "#6366f1";
  $("edTitle").textContent = "Edit Note";
  $("edInput").value = n.title || "";
  $("edBody").innerHTML = n.content || "";
  renderColors();
  $("editorBg").classList.add("show");
};

window.closeEditor = function() {
  $("editorBg").classList.remove("show");
  editingId = null;
};

function renderColors() {
  $("colors").innerHTML = COLORS.map(c =>
    '<div class="sw ' + (c === currentColor ? "on" : "") + '" style="background:' + c + '" onclick="pickColor(\'' + c + '\')"></div>'
  ).join("");
}

window.pickColor = function(c) { currentColor = c; renderColors(); };

window.fmt = function(cmd, arg) {
  document.execCommand(cmd, false, arg || null);
  $("edBody").focus();
};

window.saveNote = async function() {
  const title = $("edInput").value.trim();
  const content = $("edBody").innerHTML.trim();
  if (!title && !stripTags(content).trim()) {
    toast("Empty note", "error");
    return;
  }
  const now = new Date().toISOString();
  if (editingId) {
    const n = notes.find(x => x.id === editingId);
    if (n) {
      n.title = title || "Untitled";
      n.content = content;
      n.color = currentColor;
      n.updated = now;
    }
  } else {
    notes.unshift({
      id: "n_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
      title: title || "Untitled",
      content: content,
      color: currentColor,
      pinned: false, fav: false, deleted: false,
      created: now, updated: now
    });
  }
  closeEditor();
  render();
  toast("Saving...", "");
  await saveCloud();
};

window.delNote = function(id) {
  if (!confirm("Move to Bin?")) return;
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.deleted = true;
  n.updated = new Date().toISOString();
  render();
  toast("Moved to Bin", "");
  saveCloud();
};

window.restoreNote = function(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.deleted = false;
  n.updated = new Date().toISOString();
  render();
  toast("Restored ✓", "success");
  saveCloud();
};

window.permDelete = function(id) {
  if (!confirm("Delete permanently? Cannot be undone.")) return;
  notes = notes.filter(x => x.id !== id);
  render();
  toast("Deleted forever", "");
  saveCloud();
};

window.togglePin = function(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.pinned = !n.pinned;
  n.updated = new Date().toISOString();
  render();
  saveCloud();
};

window.toggleFav = function(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.fav = !n.fav;
  n.updated = new Date().toISOString();
  render();
  saveCloud();
};

// ═══════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════
window.toggleTheme = function() {
  const dark = !document.body.classList.contains("dark");
  document.body.classList.toggle("dark", dark);
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
  $("navTheme").textContent = dark ? "☀️" : "🌙";
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0f172a" : "#6366f1";
  try { localStorage.setItem("mynotes_theme", dark ? "dark" : "light"); } catch(e) {}
};
try {
  if (localStorage.getItem("mynotes_theme") === "dark") {
    document.body.classList.add("dark");
    $("themeBtn").textContent = "☀️";
  }
} catch(e) {}

// ═══════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════
async function loadCloud() {
  if (!currentUser) return;
  try {
    setSync("syncing");
    const ref = doc(db, COLL, currentUser.uid);
    const snap = await getDoc(ref);
    notes = snap.exists() ? (snap.data().notes || []) : [];
    render();
    setSync("online");
    console.log("Loaded", notes.length, "notes");
  } catch (e) {
    console.error("Load:", e);
    setSync("offline");
    showErr("Load failed: " + e.message);
  }
}

async function saveCloud() {
  if (!currentUser || saving) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saving = true;
    setSync("syncing");
    try {
      await setDoc(doc(db, COLL, currentUser.uid), {
        notes, updatedAt: new Date().toISOString(), email: currentUser.email
      }, { merge: true });
      setSync("online");
      toast("Saved ✓", "success");
    } catch (e) {
      console.error("Save:", e);
      setSync("offline");
      showErr("Save failed: " + e.message);
      toast("Save failed", "error");
    } finally {
      saving = false;
    }
  }, 400);
}

window.reloadCloud = async function() {
  toast("Syncing...", "");
  await loadCloud();
  toast("Synced ✓", "success");
};

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
window.signOutNow = async function() {
  if (!confirm("Sign out?")) return;
  await signOut(auth);
  location.reload();
};

(async () => {
  try {
    setProgress(20, "Signing in...");
    try {
      await signInWithEmailAndPassword(auth, EMAIL, PASS);
      console.log("Signed in");
    } catch (e) {
      if (e.code === "auth/user-not-found" || e.code === "auth/invalid-credential") {
        setProgress(30, "Creating account...");
        await createUserWithEmailAndPassword(auth, EMAIL, PASS);
        console.log("Account created");
      } else {
        throw e;
      }
    }
    setProgress(50, "Loading notes...");
  } catch (e) {
    console.error("Auth:", e);
    setProgress(100, "Auth failed");
    showErr("Auth failed: " + e.message);
  }
})();

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    await loadCloud();
    $("app").style.display = "block";
    $("fab").style.display = "flex";
    $("bottomNav").classList.add("show");
    hideLoader();
  }
});

setTimeout(() => {
  const l = $("loader");
  if (l && !l.classList.contains("hide")) {
    hideLoader();
    if (currentUser) {
      $("app").style.display = "block";
      $("fab").style.display = "flex";
      $("bottomNav").classList.add("show");
    }
  }
}, 8000);

renderColors();
</script>
</body>
</html>
