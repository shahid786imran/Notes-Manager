<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Test — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 32px;
    max-width: 520px;
    width: 100%;
  }
  h1 { font-size: 22px; color: #172033; margin-bottom: 4px; }
  .sub { color: #697386; font-size: 13px; margin-bottom: 20px; }

  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: #f8fafc; border: 1px solid #dfe4ec;
    border-radius: 8px; font-size: 13px; margin-bottom: 16px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; }
  .dot.green { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,0.2); }
  .dot.red { background: #dc2626; box-shadow: 0 0 0 4px rgba(220,38,38,0.2); }
  .dot.amber { background: #f59e0b; box-shadow: 0 0 0 4px rgba(245,158,11,0.2); }

  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 12px; color: #4f46e5;
    font-weight: 700; margin-bottom: 5px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input {
    width: 100%; padding: 11px 14px;
    border: 1px solid #dfe4ec; border-radius: 8px;
    font-size: 14px; outline: none;
    transition: all 0.2s;
    background: #f8fafc;
  }
  .field input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
    background: #fff;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 12px 20px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; margin: 4px 4px 4px 0; width: 100%;
  }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
  .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
  .btn-danger  { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }

  .login-box { display: block; }
  .app-box   { display: none; }
  .app-box.show { display: block; }
  .login-box.hide { display: none; }

  .user-info {
    background: #eff6ff; border: 1px solid #bfdbfe;
    border-radius: 8px; padding: 12px; font-size: 12px;
    color: #1e40af; margin-bottom: 14px;
  }
  .user-info strong { color: #1e3a8a; }

  .log {
    background: #0f172a; color: #e2e8f0;
    font-family: 'Courier New', monospace; font-size: 12px;
    padding: 14px; border-radius: 10px; max-height: 260px;
    overflow-y: auto; margin-top: 14px; line-height: 1.6;
  }
  .log .ok   { color: #4ade80; }
  .log .err  { color: #f87171; }
  .log .info { color: #60a5fa; }
  .log .warn { color: #fbbf24; }
  .log .time { color: #94a3b8; }

  .hint {
    font-size: 11px; color: #697386; text-align: center;
    margin-top: 10px; padding: 8px; background: #f8fafc;
    border-radius: 6px; border: 1px dashed #dfe4ec;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔥 Firebase Login Test</h1>
  <div class="sub">Email + Password authentication with Firestore & Storage</div>

  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Checking Firebase...</span>
  </div>

  <!-- LOGIN FORM -->
  <div class="login-box" id="loginBox">
    <div class="field">
      <label>Email</label>
      <input type="email" id="inpEmail" value="user@test.com" placeholder="any@email.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="inpPassword" value="123456" placeholder="min 6 characters">
    </div>
    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">🔐 Login / Sign Up</button>
    <div class="hint">
      💡 Pehli baar: naya account ban jaayega. Dobara: wahi email/password daalo to same data milega.
    </div>
  </div>

  <!-- LOGGED IN VIEW -->
  <div class="app-box" id="appBox">
    <div class="user-info">
      <div><strong>Email:</strong> <span id="uEmail">—</span></div>
      <div><strong>UID:</strong> <span id="uUid">—</span></div>
    </div>
    <button class="btn btn-success" id="btnFirestore" onclick="testFirestore()">📝 Test Firestore</button>
    <button class="btn btn-success" id="btnStorage" onclick="testStorage()">📎 Test Storage Upload</button>
    <button class="btn btn-danger" id="btnSignOut" onclick="doSignOut()">🚪 Sign Out</button>
  </div>

  <div class="log" id="log"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
// ============================================================
// CONFIG
// ============================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA9YOnNztd4H_dnXt6eRpHsnxFxMY4EYPE",
  authDomain: "notes-manager-83c48.firebaseapp.com",
  projectId: "notes-manager-83c48",
  storageBucket: "notes-manager-83c48.firebasestorage.app",
  messagingSenderId: "6098539102",
  appId: "1:6098539102:web:79c4bb84d458dbc82f5acf"
};

// ============================================================
// HELPERS
// ============================================================
function log(msg, type) {
  type = type || "info";
  const el = document.getElementById("log");
  const t = new Date().toLocaleTimeString();
  const div = document.createElement("div");
  div.innerHTML = '<span class="time">[' + t + ']</span> <span class="' + type + '">' + escapeHtml(msg) + '</span>';
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function setStatus(text, color) {
  document.getElementById("statusText").textContent = text;
  document.getElementById("statusDot").className = "dot " + (color || "");
}

// ============================================================
// INIT FIREBASE
// ============================================================
let auth, firestore, storage;

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  firestore = firebase.firestore();
  storage = firebase.storage();
  setStatus("Firebase initialized ✅", "green");
  log("Firebase SDK loaded successfully", "ok");
  log("Project: " + FIREBASE_CONFIG.projectId, "info");
} catch (e) {
  setStatus("Firebase init failed ❌", "red");
  log("Init error: " + e.message, "err");
}

// ============================================================
// AUTH STATE
// ============================================================
auth.onAuthStateChanged(function(user) {
  if (user) {
    log("User signed in: " + user.email, "ok");
    setStatus("Signed in as " + user.email, "green");
    document.getElementById("uEmail").textContent = user.email;
    document.getElementById("uUid").textContent = user.uid;
    document.getElementById("loginBox").classList.add("hide");
    document.getElementById("appBox").classList.add("show");
  } else {
    log("User signed out", "warn");
    setStatus("Not signed in", "amber");
    document.getElementById("loginBox").classList.remove("hide");
    document.getElementById("appBox").classList.remove("show");
  }
});

// ============================================================
// LOGIN / SIGNUP
// ============================================================
async function doLogin() {
  const email = document.getElementById("inpEmail").value.trim();
  const password = document.getElementById("inpPassword").value;

  if (!email || !password) { log("Email aur password dono chahiye", "err"); return; }
  if (password.length < 6) { log("Password kam se kam 6 characters ka hona chahiye", "err"); return; }

  const btn = document.getElementById("btnLogin");
  btn.disabled = true;
  btn.textContent = "⏳ Please wait...";

  try {
    log("Trying to sign in: " + email, "info");
    const cred = await auth.signInWithEmailAndPassword(email, password);
    log("✅ Sign-in success: " + cred.user.email, "ok");
  } catch (err) {
    // Agar account nahi hai to naya banao
    if (err.code === "auth/user-not-found" || err.code === "auth/invalid-login-credentials" || err.code === "auth/invalid-credential") {
      log("Account nahi mila — naya account bana rahe hain...", "warn");
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        log("✅ Account created: " + cred.user.email, "ok");
      } catch (err2) {
        log("❌ Sign-up failed: " + err2.code + " — " + err2.message, "err");
      }
    } else if (err.code === "auth/wrong-password") {
      log("❌ Password galat hai", "err");
    } else if (err.code === "auth/invalid-email") {
      log("❌ Email format sahi nahi", "err");
    } else if (err.code === "auth/weak-password") {
      log("❌ Password bahut kamzor hai (6+ characters chahiye)", "err");
    } else if (err.code === "auth/operation-not-allowed") {
      log("❌ Firebase Console mein 'Email/Password' enable nahi hai", "err");
      log("👉 Authentication → Sign-in method → Email/Password → Enable", "warn");
    } else {
      log("❌ Error: " + err.code + " — " + err.message, "err");
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "🔐 Login / Sign Up";
  }
}

// ============================================================
// SIGN OUT
// ============================================================
async function doSignOut() {
  try { await auth.signOut(); log("Signed out", "ok"); }
  catch (err) { log("Sign out failed: " + err.message, "err"); }
}

// ============================================================
// FIRESTORE TEST
// ============================================================
async function testFirestore() {
  const user = auth.currentUser;
  if (!user) { log("Sign in first", "err"); return; }

  try {
    log("Writing to Firestore...", "info");
    const testData = {
      message: "Hello from test page",
      timestamp: new Date().toISOString(),
      userEmail: user.email,
      counter: Math.floor(Math.random() * 1000)
    };

    await firestore.collection("users").doc(user.uid)
      .collection("test").doc("hello").set(testData);
    log("✅ Firestore WRITE success", "ok");

    log("Reading from Firestore...", "info");
    const snap = await firestore.collection("users").doc(user.uid)
      .collection("test").doc("hello").get();
    if (snap.exists) {
      const d = snap.data();
      log("✅ Firestore READ success: " + JSON.stringify(d), "ok");
    } else {
      log("❌ Doc not found", "err");
    }
  } catch (err) {
    log("❌ Firestore failed: " + err.code + " — " + err.message, "err");
    if (err.code === "permission-denied") {
      log("👉 Firestore Rules check karo", "warn");
    }
  }
}

// ============================================================
// STORAGE TEST
// ============================================================
async function testStorage() {
  const user = auth.currentUser;
  if (!user) { log("Sign in first", "err"); return; }

  try {
    log("Creating test file...", "info");
    const content = "Firebase Storage Test\nUser: " + user.email + "\nTime: " + new Date().toISOString();
    const blob = new Blob([content], { type: "text/plain" });

    const path = "users/" + user.uid + "/test/hello_" + Date.now() + ".txt";
    log("Uploading to: " + path, "info");

    const snap = await storage.ref(path).put(blob);
    log("✅ Storage UPLOAD success", "ok");

    const url = await snap.ref.getDownloadURL();
    log("✅ URL: " + url.substring(0, 70) + "...", "ok");

    log("Verifying by download...", "info");
    const resp = await fetch(url);
    const text = await resp.text();
    log("✅ Storage DOWNLOAD success: " + text.substring(0, 40), "ok");

    log("Cleaning up...", "info");
    await snap.ref.delete();
    log("✅ Cleanup done — All tests passed! 🎉", "ok");
  } catch (err) {
    log("❌ Storage failed: " + err.code + " — " + err.message, "err");
    if (err.code === "storage/unauthorized") {
      log("👉 Storage Rules check karo", "warn");
    }
  }
}
</script>
</body>
</html>
