<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Notes Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@400;700&family=Inter:wght@400;700&family=Open+Sans:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: var(--app-font, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); }
:root {
  --primary: #6366f1; --primary-2: #8b5cf6; --accent: #ec4899;
  --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --info: #0ea5e9;
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f8fafc;
  --text: #172033; --muted: #697386; --border: #dfe4ec;
  --shadow: 0 4px 12px rgba(99,102,241,.15);
  --shadow-lg: 0 12px 32px rgba(99,102,241,.25);
  --radius: 14px; --fs: 15px; --anim: .25s;
  --app-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --card-blur: 0px; --card-bg-opacity: 1;
}
body.dark {
  --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
  --text: #f1f5f9; --muted: #94a3b8; --border: #334155;
  --shadow: 0 4px 12px rgba(0,0,0,.3);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
}
body.scheme-ocean { --primary: #0ea5e9; --primary-2: #0369a1; --accent: #06b6d4; }
body.scheme-sunset { --primary: #f97316; --primary-2: #be123c; --accent: #fbbf24; }
body.scheme-forest { --primary: #10b981; --primary-2: #065f46; --accent: #84cc16; }
body.scheme-rose { --primary: #ec4899; --primary-2: #9d174d; --accent: #f43f5e; }

body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  background-attachment: fixed; color: var(--text);
  min-height: 100vh; padding-bottom: 100px;
  transition: background var(--anim), color var(--anim);
  -webkit-user-select: none; user-select: none; font-size: var(--fs);
  font-family: var(--app-font);
}
body.dark { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
body.compact { font-size: 14px; }
body.no-anim * { transition: none !important; animation: none !important; }
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; transition: all var(--anim); }
button:active { transform: scale(.95); }

/* Loader */
#loader { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899); color: #fff; transition: opacity .5s, visibility .5s; }
#loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
#loader .icon { font-size: 68px; margin-bottom: 18px; animation: bounce 2.4s ease-in-out infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
#loader h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
#loader .status { font-size: 13px; opacity: .9; margin-bottom: 22px; font-weight: 500; min-height: 18px; }
#loader .bar-wrap { width: 240px; height: 6px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; }
#loader .bar { height: 100%; width: 0%; background: #fff; border-radius: 99px; transition: width .4s ease; }
#loader .pct { margin-top: 10px; font-size: 12px; font-weight: 700; }

/* Error box */
#err-box { position: fixed; bottom: 0; left: 0; right: 0; z-index: 999999; background: var(--danger); color: #fff; padding: 14px 40px 14px 16px; font-size: 12px; font-family: ui-monospace, monospace; line-height: 1.5; display: none; max-height: 40vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
#err-box.show { display: block; }
#err-box .x { position: absolute; top: 10px; right: 14px; font-size: 22px; font-weight: 700; cursor: pointer; }

/* Toast */
#toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e1b4b; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 600; z-index: 9999; opacity: 0; pointer-events: none; transition: all .3s; max-width: calc(100vw - 40px); text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,.4); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--danger); }
#toast.success { background: var(--success); }
#toast.warn { background: var(--warning); }

/* Main layout */
.app { max-width: 720px; margin: 0 auto; padding: 12px; }

/* Header */
.header { background: rgba(255,255,255,.9); backdrop-filter: blur(20px); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.5); box-shadow: var(--shadow); position: sticky; top: 8px; z-index: 100; }
body.dark .header { background: rgba(30,41,59,.9); border-color: rgba(255,255,255,.1); }
.header .logo { font-size: 22px; }
.header .title { flex: 1; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.header .sync-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.header .sync-dot.offline { background: #dc2626; }
.header .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
.header .sync-dot.conflict { background: #a855f7; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .4; } }
.header button { width: 38px; height: 38px; border-radius: 11px; background: rgba(255,255,255,.5); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
body.dark .header button { background: rgba(255,255,255,.06); }
.header button:hover { background: rgba(99,102,241,.15); }
.header button .badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; }

/* Controls (search + filter) */
.controls { background: rgba(255,255,255,.9); backdrop-filter: blur(20px); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,.5); box-shadow: var(--shadow); display: flex; gap: 6px; align-items: center; }
body.dark .controls { background: rgba(30,41,59,.9); border-color: rgba(255,255,255,.1); }
.search-box { flex: 1; position: relative; }
.search-box input { width: 100%; height: 40px; padding: 0 14px 0 36px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); color: var(--text); font-size: 14px; outline: none; }
body.dark .search-box input { background: rgba(255,255,255,.06); }
.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.search-box .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .5; pointer-events: none; }
.search-box .clear-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); }
.search-box .clear-btn.show { display: flex; }
.icon-btn { width: 40px; height: 40px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; position: relative; }
body.dark .icon-btn { background: rgba(255,255,255,.06); }
.icon-btn.on { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; }

/* Tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 8px 14px; border-radius: 11px; background: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.5); font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--text); display: flex; align-items: center; gap: 6px; flex: none; }
body.dark .tab { background: rgba(30,41,59,.8); border-color: rgba(255,255,255,.1); }
.tab.on { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; box-shadow: var(--shadow); }
.tab .count { background: rgba(0,0,0,.15); padding: 1px 7px; border-radius: 8px; font-size: 11px; font-weight: 800; }
.tab.on .count { background: rgba(255,255,255,.25); }

/* Notes container */
.notes { display: flex; flex-direction: column; gap: 10px; }
.notes.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
@media (max-width: 400px) { .notes.grid { grid-template-columns: repeat(2, 1fr); } }

/* Note card */
.note { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; box-shadow: var(--shadow); position: relative; overflow: hidden; animation: slideIn .25s ease backwards; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.note:active { transform: scale(.985); box-shadow: var(--shadow-lg); }
.note.selected { background: rgba(99,102,241,.1); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99,102,241,.2); }
.note .color-bar { width: 4px; align-self: stretch; border-radius: 4px; background: var(--primary); flex: none; }
.note .content { flex: 1; min-width: 0; }
.note .title { font-size: 15px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; word-break: break-word; }
.note .title .pin { color: var(--danger); font-size: 12px; flex: none; }
.note .title .fav { color: #eab308; font-size: 12px; flex: none; }
.note .title .lock { color: var(--warning); font-size: 12px; flex: none; }
.note .preview { font-size: 12.5px; color: var(--muted); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word; }
.note .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.note .tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-weight: 700; }
.note .meta { font-size: 10.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note .meta .chip { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-weight: 700; }
.note .actions { display: flex; gap: 2px; flex-direction: column; align-items: center; flex: none; }
.note .actions button { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); }
.note .actions button:hover { background: rgba(99,102,241,.15); }
.note .actions button.fav-on { color: #eab308; }
.note .actions button.pin-on { color: var(--danger); }

/* Empty state */
.empty { text-align: center; padding: 60px 24px; background: rgba(255,255,255,.75); backdrop-filter: blur(20px); border-radius: var(--radius); border: 1px solid rgba(255,255,255,.5); box-shadow: var(--shadow); }
body.dark .empty { background: rgba(30,41,59,.75); border-color: rgba(255,255,255,.1); }
.empty .icon { font-size: 72px; opacity: .5; margin-bottom: 16px; }
.empty h2 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.empty p { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; max-width: 320px; margin: 0 auto 20px; }
.empty button { padding: 12px 24px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; font-size: 14px; font-weight: 700; box-shadow: var(--shadow-lg); }

/* FAB */
.fab { position: fixed; bottom: 20px; right: 20px; z-index: 200; width: 60px; height: 60px; border-radius: 20px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(99,102,241,.5); }
.fab:active { transform: scale(.9); }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,.96); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: none; padding: 6px 0 max(6px, env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
body.dark .bottom-nav { background: rgba(30,41,59,.96); }
.bottom-nav.show { display: flex; }
.bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; color: var(--muted); font-size: 10px; font-weight: 700; }
.bottom-nav button.on { color: var(--primary); }
.bottom-nav button .ico { font-size: 20px; }

/* Modal / Overlay base */
.modal-bg { position: fixed; inset: 0; z-index: 5000; background: rgba(15,23,42,.55); backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; }
.modal-bg.show { display: flex; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-bg.center { align-items: center; padding: 16px; }
.modal { width: 100%; max-width: 720px; background: var(--surface); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; max-height: 94vh; animation: slideUp .28s cubic-bezier(.22,1,.36,1); }
.modal-bg.center .modal { border-radius: 20px; max-height: 88vh; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.modal-head .title { flex: 1; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-head .btn-close { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.modal-head .btn-primary { padding: 0 16px; height: 36px; border-radius: 18px; background: linear-gradient(135deg, var(--success), #059669); color: #fff; font-size: 13px; font-weight: 800; }
.modal-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: .5px; }
.field input[type="text"], .field input[type="search"], .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); font-size: 14px; outline: none; font-family: inherit; }
body.dark .field input, body.dark .field textarea, body.dark .field select { background: rgba(255,255,255,.06); }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.field textarea { min-height: 100px; resize: vertical; line-height: 1.5; }

/* Rich editor */
.rich { min-height: 260px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); color: var(--text); font-size: 15px; line-height: 1.7; outline: none; }
body.dark .rich { background: rgba(255,255,255,.06); }
.rich:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.rich:empty:before { content: attr(data-ph); color: var(--muted); }
.rich ul, .rich ol { padding-left: 24px; margin: 8px 0; }
.rich ol { list-style-type: decimal; }
.rich ol ol { list-style-type: lower-alpha; }
.rich ol ol ol { list-style-type: lower-roman; }
.rich ul { list-style-type: disc; }
.rich ul ul { list-style-type: circle; }
.rich li { margin: 4px 0; line-height: 1.6; }
.rich h1, .rich h2, .rich h3 { margin: 12px 0 6px; }
.rich blockquote { border-left: 4px solid var(--primary); padding-left: 12px; margin: 8px 0; opacity: .85; }
.rich code { background: var(--surface); padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: .92em; }
.rich a { color: var(--primary); text-decoration: underline; }

/* Toolbar */
.toolbar { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.toolbar button { min-width: 34px; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 4px; }
body.dark .toolbar button { background: rgba(255,255,255,.06); }
.toolbar button:hover { background: rgba(99,102,241,.15); }
.toolbar button.active { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; }
.toolbar .sep { width: 1px; background: var(--border); margin: 4px 2px; }

/* Color swatches */
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; flex: none; }
.sw:hover { transform: scale(1.1); }
.sw.on { border-color: var(--text); box-shadow: 0 0 0 3px var(--surface); }

/* Icon picker grid */
.icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; padding: 10px; background: var(--surface-2); border-radius: 10px; max-height: 240px; overflow-y: auto; }
body.dark .icon-grid { background: rgba(255,255,255,.06); }
.icon-grid button { aspect-ratio: 1/1; border-radius: 8px; background: var(--surface); font-size: 18px; display: flex; align-items: center; justify-content: center; border: 2px solid transparent; }
body.dark .icon-grid button { background: rgba(255,255,255,.04); }
.icon-grid button.on { border-color: var(--primary); background: rgba(99,102,241,.15); }

/* Context menu */
.ctx-menu { position: fixed; z-index: 8000; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px 0; min-width: 200px; max-height: 70vh; overflow-y: auto; display: none; }
.ctx-menu.show { display: block; animation: fadeIn .15s; }
.ctx-menu button { display: block; width: 100%; padding: 10px 16px; text-align: left; font-size: 13px; color: var(--text); background: transparent; border: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.ctx-menu button:hover { background: rgba(99,102,241,.12); }
.ctx-menu button.danger { color: var(--danger); }
.ctx-menu .divider { height: 1px; background: var(--border); margin: 4px 0; }

/* Sidebar */
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; z-index: 6000; background: var(--surface); box-shadow: 4px 0 20px rgba(0,0,0,.15); transform: translateX(-105%); display: flex; flex-direction: column; }
.sidebar.open { transform: translateX(0); }
.sidebar-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.sidebar-head .title { flex: 1; font-size: 16px; font-weight: 800; }
.sidebar-head button { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.sidebar-body { flex: 1; overflow-y: auto; padding: 12px; }
.sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text); transition: .15s; }
.sidebar-item:hover { background: rgba(99,102,241,.1); }
.sidebar-item.on { background: linear-gradient(90deg, rgba(99,102,241,.2), transparent); font-weight: 700; }
.sidebar-item .ico { width: 24px; text-align: center; font-size: 16px; flex: none; }
.sidebar-item .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-item .cnt { font-size: 11px; background: var(--surface-2); padding: 2px 7px; border-radius: 10px; font-weight: 700; color: var(--muted); flex: none; }
.sidebar-item .edit-btn { font-size: 12px; opacity: .5; padding: 2px 4px; }
.sidebar-item .edit-btn:hover { opacity: 1; }
.sidebar-sep { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; padding: 12px 12px 4px; }
.sidebar-add { width: 100%; padding: 10px; border: 2px dashed var(--border); border-radius: 10px; color: var(--primary); font-weight: 700; font-size: 13px; margin-top: 8px; }

/* Right sidebar */
.rsb { position: fixed; top: 0; right: 0; bottom: 0; width: 280px; z-index: 6000; background: var(--surface); box-shadow: -4px 0 20px rgba(0,0,0,.15); transform: translateX(105%); display: flex; flex-direction: column; }
.rsb.open { transform: translateX(0); }
.rsb-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.rsb-head .title { flex: 1; font-size: 16px; font-weight: 800; }
.rsb-body { flex: 1; overflow-y: auto; padding: 12px; }

/* Overlay backdrop */
.overlay { position: fixed; inset: 0; z-index: 5500; background: rgba(15,23,42,.5); display: none; }
.overlay.show { display: block; animation: fadeIn .2s; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-card { background: var(--surface-2); border-radius: 12px; padding: 14px; text-align: center; border: 1px solid var(--border); }
.stat-card .val { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
.stat-card .lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.stat-card .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* Attachment list */
.attach-list { display: flex; flex-direction: column; gap: 6px; }
.attach-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
body.dark .attach-item { background: rgba(255,255,255,.06); }

  notes = JSON.parse(JSON.stringify(last.snapshot.notes));
  groups = JSON.parse(JSON.stringify(last.snapshot.groups));
  render();
  saveCloud();
  $("undoBar").classList.remove("show");
  toast("Undone ✓", "success");
};

// ═══════════════════════════════════════════
// FILTERING + SORTING
// ═══════════════════════════════════════════
function getFilteredNotes() {
  const q = ($("search").value || "").toLowerCase().trim();
  let items = notes.slice();

  // Tab filter
  if (currentTab === "trash") items = items.filter(n => n.deleted);
  else if (currentTab === "archive") items = items.filter(n => n.archived && !n.deleted);
  else {
    items = items.filter(n => !n.deleted && !n.archived);
    if (currentTab === "pinned") items = items.filter(n => n.pinned);
    else if (currentTab === "fav") items = items.filter(n => n.fav);
    else if (currentTab === "locked") items = items.filter(n => n.locked);
    else if (currentTab.startsWith("group:")) {
      const gid = currentTab.slice(6);
      items = items.filter(n => n.groupId === gid);
    } else if (currentTab.startsWith("tag:")) {
      const tag = currentTab.slice(4);
      items = items.filter(n => (n.tags || []).includes(tag));
    }
  }

  // Filters
  if (settings.favOnly) items = items.filter(n => n.fav);
  if (settings.filterColor) items = items.filter(n => n.color === settings.filterColor);
  if (settings.filterGroup) items = items.filter(n => n.groupId === settings.filterGroup);
  if (settings.filterTag) items = items.filter(n => (n.tags || []).includes(settings.filterTag));
  if (settings.filterDate) {
    const now = Date.now();
    const day = 86400000;
    const cutoff = settings.filterDate === "today" ? now - (now % day) :
                   settings.filterDate === "week" ? now - 7 * day :
                   settings.filterDate === "month" ? now - 30 * day : 0;
    items = items.filter(n => new Date(n.updated || n.created).getTime() >= cutoff);
  }

  // Search
  if (q) items = items.filter(n =>
    (n.title || "").toLowerCase().includes(q) ||
    stripTags(n.content).toLowerCase().includes(q) ||
    (n.tags || []).some(t => t.toLowerCase().includes(q))
  );

  // Sort
  items.sort((a, b) => {
    let va, vb;
    if (settings.sortBy === "title") { va = (a.title || "").toLowerCase(); vb = (b.title || "").toLowerCase(); }
    else if (settings.sortBy === "color") { va = a.color || ""; vb = b.color || ""; }
    else if (settings.sortBy === "group") { va = a.groupId || ""; vb = b.groupId || ""; }
    else if (settings.sortBy === "created") { va = new Date(a.created).getTime(); vb = new Date(b.created).getTime(); }
    else { va = new Date(a.updated || a.created).getTime(); vb = new Date(b.updated || b.created).getTime(); }
    if (va < vb) return settings.sortDir === "asc" ? -1 : 1;
    if (va > vb) return settings.sortDir === "asc" ? 1 : -1;
    return 0;
  });

  // Pinned always on top (except trash/archive)
  if (currentTab !== "trash" && currentTab !== "archive") {
    const pinned = items.filter(n => n.pinned);
    const rest = items.filter(n => !n.pinned);
    items = [...pinned, ...rest];
  }
  return items;
}

// ═══════════════════════════════════════════
// RENDER NOTES
// ═══════════════════════════════════════════
window.render = function () {
  const items = getFilteredNotes();
  const container = $("notes");
  container.className = "notes" + (settings.viewMode === "grid" ? " grid" : "");

  if (!items.length) {
    const q = ($("search").value || "").trim();
    const msg = q ? "No results for \"" + q + "\"" : currentTab === "trash" ? "Bin is empty" : currentTab === "archive" ? "Archive is empty" : "No notes yet";
    const sub = q ? "Try different keywords." : "Tap ＋ to create your first note.";
    container.innerHTML = `<div class="empty"><div class="icon">${q ? "🔍" : "📝"}</div><h2>${msg}</h2><p>${sub}</p>${!q ? '<button onclick="openEditor()">✏️ Create Note</button>' : ''}</div>`;
    updateBulkBar();
    return;
  }

  container.innerHTML = items.map(n => {
    const preview = stripTags(n.content).slice(0, 160) || "Empty note";
    const group = groups.find(g => g.id === n.groupId);
    const tags = (n.tags || []).slice(0, 4);
    const hasAttach = (n.attachments || []).length > 0;
    const isSelected = selectedIds.has(n.id);
    const isMulti = selectedIds.size > 0;
    return `<div class="note ${isSelected ? "selected" : ""}" onclick="${isMulti ? `toggleSelect('${n.id}')` : `onNoteClick(event,'${n.id}')`}" oncontextmenu="event.preventDefault();openCtxMenu(event,'${n.id}')">
      <div class="color-bar" style="background:${n.color || "#6366f1"}"></div>
      <div class="content">
        <div class="title">
          ${n.pinned ? '<span class="pin">📌</span>' : ''}
          ${n.fav ? '<span class="fav">⭐</span>' : ''}
          ${n.locked ? '<span class="lock">🔒</span>' : ''}
          ${escapeHtml(n.title || "Untitled")}
        </div>
        <div class="preview">${escapeHtml(preview)}</div>
        ${tags.length || group || hasAttach ? `<div class="tags">
          ${group ? `<span class="tag" style="background:${group.color}20;color:${group.color}">${group.icon} ${escapeHtml(group.name)}</span>` : ''}
          ${tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join("")}
          ${hasAttach ? `<span class="tag">📎 ${n.attachments.length}</span>` : ''}
        </div>` : ''}
        <div class="meta">
          <span>🕐 ${relTime(n.updated || n.created)}</span>
          ${n.locked ? '<span class="chip">🔒 Locked</span>' : ''}
        </div>
      </div>
      <div class="actions">
        ${!n.deleted && !n.archived ? `
          <button class="${n.fav ? "fav-on" : ""}" onclick="event.stopPropagation();toggleFav('${n.id}')">${n.fav ? "⭐" : "☆"}</button>
          <button class="${n.pinned ? "pin-on" : ""}" onclick="event.stopPropagation();togglePin('${n.id}')">📌</button>
          <button onclick="event.stopPropagation();openCtxMenu(event,'${n.id}')">⋯</button>
        ` : n.deleted ? `
          <button onclick="event.stopPropagation();restoreNote('${n.id}')">↩</button>
          <button style="color:var(--danger)" onclick="event.stopPropagation();permDelete('${n.id}')">❌</button>
        ` : `
          <button onclick="event.stopPropagation();unarchiveNote('${n.id}')">↩</button>
          <button style="color:var(--danger)" onclick="event.stopPropagation();delNote('${n.id}')">🗑</button>
        `}
      </div>
    </div>`;
  }).join("");
  updateBulkBar();
  renderTabs();
};

// ═══════════════════════════════════════════
// NOTE CLICK / CONTEXT MENU
// ═══════════════════════════════════════════
window.onNoteClick = function (e, id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  if (n.locked) {
    promptPassword("Unlock Note", pwd => {
      if (pwd === n.password) {
        editNote(id);
      } else {
        toast("Wrong password", "error");
      }
    });
    return;
  }
  editNote(id);
};

window.openCtxMenu = function (e, id) {
  e.stopPropagation();
  const n = notes.find(x => x.id === id);
  if (!n) return;
  const m = $("ctxMenu");
  const items = [];
  if (!n.deleted && !n.archived) {
    items.push({ icon: "✏️", label: "Edit", fn: () => editNote(id) });
    items.push({ icon: "📋", label: "Copy", fn: () => copyNote(id) });
    items.push({ icon: "⎘", label: "Duplicate", fn: () => duplicateNote(id) });
    items.push({ icon: "📤", label: "Share", fn: () => shareNote(id) });
    items.push({ divider: true });
    items.push({ icon: n.pinned ? "📍" : "📌", label: n.pinned ? "Unpin" : "Pin", fn: () => togglePin(id) });
    items.push({ icon: n.fav ? "☆" : "⭐", label: n.fav ? "Remove Favorite" : "Favorite", fn: () => toggleFav(id) });
    items.push({ icon: n.locked ? "🔓" : "🔒", label: n.locked ? "Unlock" : "Lock", fn: () => toggleLock(id) });
    items.push({ icon: "🎨", label: "Color", fn: () => openColorPickerFor(id) });
    items.push({ icon: "📦", label: "Archive", fn: () => archiveNote(id) });
    items.push({ divider: true });
    items.push({ icon: "🖨", label: "Print", fn: () => printNote(id) });
    items.push({ icon: "ℹ️", label: "Info", fn: () => showNoteInfo(id) });
    items.push({ divider: true });
    items.push({ icon: "🗑", label: "Delete", danger: true, fn: () => delNote(id) });
  } else if (n.deleted) {
    items.push({ icon: "↩️", label: "Restore", fn: () => restoreNote(id) });
    items.push({ icon: "❌", label: "Delete Forever", danger: true, fn: () => permDelete(id) });
  } else if (n.archived) {
    items.push({ icon: "↩️", label: "Unarchive", fn: () => unarchiveNote(id) });
    items.push({ icon: "🗑", label: "Delete", danger: true, fn: () => delNote(id) });
  }
  m.innerHTML = items.map(it => it.divider ? '<div class="divider"></div>' : `<button class="${it.danger ? "danger" : ""}" onclick="closeCtxMenu();(${it.fn.toString()})()"><span>${it.icon}</span>${it.label}</button>`).join("");
  const x = Math.min(e.clientX || 200, window.innerWidth - 220);
  const y = Math.min(e.clientY || 200, window.innerHeight - 300);
  m.style.left = x + "px";
  m.style.top = y + "px";
  m.classList.add("show");
  setTimeout(() => document.addEventListener("click", closeCtxMenuOnce), 100);
};
window.closeCtxMenu = function () { $("ctxMenu").classList.remove("show"); };
function closeCtxMenuOnce(e) {
  if (!e.target.closest("#ctxMenu")) { closeCtxMenu(); document.removeEventListener("click", closeCtxMenuOnce); }
}

}

// ═══════════════════════════════════════════
// TOGGLE / ACTION FUNCTIONS
// ═══════════════════════════════════════════
window.togglePin = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const snap = { notes, groups };
  n.pinned = !n.pinned; n.updated = new Date().toISOString();
  pushUndo(n.pinned ? "Pinned" : "Unpinned", snap);
  render(); saveCloud();
};
window.toggleFav = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const snap = { notes, groups };
  n.fav = !n.fav; n.updated = new Date().toISOString();
  pushUndo(n.fav ? "Favorited" : "Unfavorited", snap);
  render(); saveCloud();
};
window.toggleLock = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  if (!n.locked) {
    promptPassword("Set Lock Password", pwd => {
      n.locked = true; n.password = pwd; n.updated = new Date().toISOString();
      render(); saveCloud();
      toast("Note locked 🔒", "success");
    });
  } else {
    promptPassword("Unlock Note", pwd => {
      if (pwd === n.password) {
        n.locked = false; delete n.password; n.updated = new Date().toISOString();
        render(); saveCloud();
        toast("Note unlocked", "success");
      } else toast("Wrong password", "error");
    });
  }
};
window.archiveNote = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const snap = { notes, groups };
  n.archived = true; n.updated = new Date().toISOString();
  pushUndo("Archived", snap);
  render(); saveCloud();
  toast("Archived", "success");
};
window.unarchiveNote = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const snap = { notes, groups };
  n.archived = false; n.updated = new Date().toISOString();
  pushUndo("Unarchived", snap);
  render(); saveCloud();
  toast("Unarchived", "success");
};
window.delNote = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const snap = { notes, groups };
  n.deleted = true; n.updated = new Date().toISOString();
  pushUndo("Moved to Bin", snap);
  render(); saveCloud();
  toast("Moved to Bin", "");
};
window.restoreNote = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const snap = { notes, groups };
  n.deleted = false; n.updated = new Date().toISOString();
  pushUndo("Restored", snap);
  render(); saveCloud();
  toast("Restored ✓", "success");
};
window.permDelete = function (id) {
  if (!confirm("Delete permanently? Cannot be undone.")) return;
  const snap = { notes, groups };
  notes = notes.filter(x => x.id !== id);
  pushUndo("Deleted forever", snap);
  render(); saveCloud();
  toast("Deleted forever", "");
};
window.copyNote = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const text = (n.title || "") + "\n\n" + stripTags(n.content);
  navigator.clipboard.writeText(text).then(() => toast("Copied ✓", "success")).catch(() => toast("Copy failed", "error"));
};
window.duplicateNote = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const snap = { notes, groups };
  const copy = JSON.parse(JSON.stringify(n));
  copy.id = uid();
  copy.title = (n.title || "Untitled") + " (Copy)";
  copy.created = new Date().toISOString();
  copy.updated = copy.created;
  notes.unshift(copy);
  pushUndo("Duplicated", snap);
  render(); saveCloud();
  toast("Duplicated ✓", "success");
};
window.shareNote = async function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const text = (n.title || "") + "\n\n" + stripTags(n.content);
  if (navigator.share) {
    try { await navigator.share({ title: n.title, text }); } catch (e) {}
  } else {
    await navigator.clipboard.writeText(text);
    toast("Copied to clipboard", "success");
  }
};
window.printNote = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const w = window.open("", "_blank");
  w.document.write(`<!DOCTYPE html><html><head><title>${escapeHtml(n.title)}</title><style>body{font-family:Arial;max-width:800px;margin:auto;padding:20px;line-height:1.6}h1{border-bottom:2px solid #000;padding-bottom:8px}.meta{color:#666;font-size:12px}</style></head><body><h1>${escapeHtml(n.title)}</h1><div class="meta">${new Date(n.updated || n.created).toLocaleString()}</div><hr>${n.content || ""}</body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 300);
};
window.showNoteInfo = function (id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const group = groups.find(g => g.id === n.groupId);
  const info = `
    <div class="modal-bg center show" onclick="if(event.target===this)this.remove()">
      <div class="modal" style="border-radius:20px;max-width:420px">
        <div class="modal-head"><div class="title">ℹ️ Note Info</div><button class="btn-close" onclick="this.closest('.modal-bg').remove()">✕</button></div>
        <div class="modal-body">
          <div class="field"><label>Title</label><div>${escapeHtml(n.title)}</div></div>
          <div class="field"><label>Created</label><div>${new Date(n.created).toLocaleString()}</div></div>
          <div class="field"><label>Updated</label><div>${new Date(n.updated || n.created).toLocaleString()}</div></div>
          <div class="field"><label>Words / Characters</label><div>${stripTags(n.content).trim().split(/\\s+/).length} / ${stripTags(n.content).length}</div></div>
          ${group ? `<div class="field"><label>Group</label><div>${group.icon} ${escapeHtml(group.name)}</div></div>` : ""}
          ${(n.tags || []).length ? `<div class="field"><label>Tags</label><div>${n.tags.map(t => "#" + escapeHtml(t)).join(" ")}</div></div>` : ""}
          ${(n.attachments || []).length ? `<div class="field"><label>Attachments</label><div>${n.attachments.length} file(s)</div></div>` : ""}
        </div>
      </div>
    </div>`;
  const div = document.createElement("div");
  div.innerHTML = info;
  document.body.appendChild(div.firstElementChild);
};
// ═══════════════════════════════════════════
// EDITOR
// ═══════════════════════════════════════════
window.openEditor = function () {
  editingId = null;
  currentColor = "#6366f1";
  $("edTitle").textContent = "New Note";
  $("edInput").value = "";
  $("edBody").innerHTML = "";
  $("edTags").value = "";
  renderColors();
  renderEditorGroupSelect();
  renderAttachments([]);
  renderToolbar();
  $("editorBg").classList.add("show");
  setTimeout(() => $("edInput").focus(), 300);
};

window.editNote = function (id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  editingId = id;
  currentColor = n.color || "#6366f1";
  $("edTitle").textContent = "Edit Note";
  $("edInput").value = n.title || "";
  $("edBody").innerHTML = n.content || "";
  $("edTags").value = (n.tags || []).join(", ");
  renderColors();
  renderEditorGroupSelect(n.groupId);
  renderAttachments(n.attachments || []);
  renderToolbar();
  $("editorBg").classList.add("show");
};

window.closeEditor = function () {
  $("editorBg").classList.remove("show");
  editingId = null;
};

function renderColors() {
  $("colors").innerHTML = COLORS.map(c =>
    `<div class="sw ${c === currentColor ? "on" : ""}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join("");
}
window.pickColor = function (c) { currentColor = c; renderColors(); };

function renderEditorGroupSelect(selectedId) {
  const sel = $("edGroup");
  sel.innerHTML = '<option value="">— No Group —</option>' +
    groups.map(g => `<option value="${g.id}" ${selectedId === g.id ? "selected" : ""}>${g.icon} ${escapeHtml(g.name)}</option>`).join("");
}

function renderAttachments(list) {
  if (!list.length) {
    $("attachList").innerHTML = '<div style="font-size:12px;color:var(--muted);padding:6px 0;">No files attached</div>';
    return;
  }
  $("attachList").innerHTML = list.map((f, i) => `
    <div class="attach-item">
      <span>${fileIcon(f.name)}</span>
      <span class="name">${escapeHtml(f.name)}</span>
      <span class="size">${fmtBytes(f.size)}</span>
      <div class="actions">
        <button onclick="window.open('${f.url}','_blank')">👁</button>
        <button class="danger" onclick="removeAttachment(${i})">✕</button>
      </div>
    </div>
  `).join("");
}

let pendingAttachments = [];
window.pickFiles = function () {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.multiple = true;
  inp.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      try {
        toast("Uploading " + file.name + "...");
        const path = `notes_pro/${currentUser.uid}/${Date.now()}_${file.name}`;
        const ref = storageRef(storage, path);
        await uploadBytes(ref, file);
        const url = await getDownloadURL(ref);
        pendingAttachments.push({ name: file.name, size: file.size, url, path });
      } catch (err) {
        toast("Upload failed: " + err.message, "error");
      }
    }
    renderAttachments(pendingAttachments);
    toast(pendingAttachments.length + " file(s) ready", "success");
  };
  inp.click();
};

window.removeAttachment = function (i) {
  pendingAttachments.splice(i, 1);
  renderAttachments(pendingAttachments);
};

// ═══════════════════════════════════════════
// TOOLBAR
// ═══════════════════════════════════════════
function renderToolbar() {
  const buttons = [
    { cmd: "bold", label: "B", style: "font-weight:900" },
    { cmd: "italic", label: "I", style: "font-style:italic" },
    { cmd: "underline", label: "U", style: "text-decoration:underline" },
    { cmd: "strikeThrough", label: "S", style: "text-decoration:line-through" },
    { sep: true },
    { cmd: "insertUnorderedList", label: "•" },
    { cmd: "insertOrderedList", label: "1." },
    { cmd: "indent", label: "→" },
    { cmd: "outdent", label: "←" },
    { sep: true },
    { cmd: "formatBlock", arg: "H1", label: "H1" },
    { cmd: "formatBlock", arg: "H2", label: "H2" },
    { cmd: "formatBlock", arg: "H3", label: "H3" },
    { cmd: "formatBlock", arg: "BLOCKQUOTE", label: "❝" },
    { sep: true },
    { cmd: "justifyLeft", label: "⬅" },
    { cmd: "justifyCenter", label: "⬌" },
    { cmd: "justifyRight", label: "➡" },
    { cmd: "justifyFull", label: "☰" },
    { sep: true },
    { action: "color", label: "🎨" },
    { action: "highlight", label: "🖍" },
    { action: "link", label: "🔗" },
    { action: "emoji", label: "😀" },
    { action: "date", label: "📅" },
    { action: "time", label: "🕐" },
    { action: "hr", label: "—" },
    { sep: true },
    { cmd: "undo", label: "↶" },
    { cmd: "redo", label: "↷" },
    { cmd: "removeFormat", label: "🧹" },
    { action: "code", label: "</>" }
  ];
  $("toolbar").innerHTML = '<div class="toolbar">' + buttons.map(b => {
    if (b.sep) return '<div class="sep"></div>';
    if (b.cmd) return `<button onmousedown="event.preventDefault()" onclick="fmt('${b.cmd}',${b.arg ? `'${b.arg}'` : "null"})" style="${b.style || ""}">${b.label}</button>`;
    return `<button onmousedown="event.preventDefault()" onclick="toolbarAction('${b.action}')">${b.label}</button>`;
  }).join("") + "</div>";
}

window.fmt = function (cmd, arg) {
  document.execCommand(cmd, false, arg || null);
  $("edBody").focus();
};

window.toolbarAction = function (action) {
  const body = $("edBody");
  body.focus();
  if (action === "color") {
    const c = prompt("Enter color (hex or name):", "#000000");
    if (c) document.execCommand("foreColor", false, c);
  } else if (action === "highlight") {
    const c = prompt("Highlight color:", "#ffff00");
    if (c) document.execCommand("hiliteColor", false, c);
  } else if (action === "link") {
    const url = prompt("Enter URL:", "https://");
    if (url) document.execCommand("createLink", false, url);
  } else if (action === "emoji") {
    const emoji = prompt("Emoji:", "😀");
    if (emoji) document.execCommand("insertText", false, emoji);
  } else if (action === "date") {
    const d = new Date();
    document.execCommand("insertText", false, d.toLocaleDateString());
  } else if (action === "time") {
    const d = new Date();
    document.execCommand("insertText", false, d.toLocaleTimeString());
  } else if (action === "hr") {
    document.execCommand("insertHorizontalRule", false, null);
  } else if (action === "code") {
    const txt = prompt("Code:");
    if (txt) document.execCommand("insertHTML", false, `<code>${escapeHtml(txt)}</code>`);
  }
};

// ═══════════════════════════════════════════
// SAVE NOTE
// ═══════════════════════════════════════════
window.saveNote = async function () {
  const title = $("edInput").value.trim();
  const content = $("edBody").innerHTML.trim();
  const tagsRaw = $("edTags").value.trim();
  const groupId = $("edGroup").value || null;
  const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean) : [];

  if (!title && !stripTags(content).trim() && !pendingAttachments.length) {
    toast("Empty note", "error");
    return;
  }

  const now = new Date().toISOString();
  const snap = { notes, groups };

  if (editingId) {
    const n = notes.find(x => x.id === editingId);
    if (!n) return;
    n.title = title || "Untitled";
    n.content = content;
    n.color = currentColor;
    n.tags = tags;
    n.groupId = groupId;
    n.attachments = [...(n.attachments || []), ...pendingAttachments];
    n.updated = now;
    pushUndo("Note updated", snap);
  } else {
    notes.unshift({
      id: uid(),
      title: title || "Untitled",
      content, color: currentColor,
      tags, groupId,
      attachments: [...pendingAttachments],
      pinned: false, fav: false, locked: false, deleted: false, archived: false,
      created: now, updated: now
    });
    pushUndo("Note created", snap);
  }

  pendingAttachments = [];
  closeEditor();
  render();
  toast("Saving...", "");
  await saveCloud();
};

  $("pwdTitle").textContent = title;

// ═══════════════════════════════════════════
window.openFilterSheet = function () {
  // Colors
  $("filterColors").innerHTML = COLORS.map(c =>
    `<div class="sw ${settings.filterColor === c ? "on" : ""}" style="background:${c}" onclick="setFilter('color','${c}')"></div>`
  ).join("") + `<div class="fchip ${!settings.filterColor ? "on" : ""}" onclick="setFilter('color',null)">All</div>`;

  // Groups
  $("filterGroups").innerHTML = `<div class="fchip ${!settings.filterGroup ? "on" : ""}" onclick="setFilter('group',null)">All</div>` +
    groups.map(g => `<div class="fchip ${settings.filterGroup === g.id ? "on" : ""}" onclick="setFilter('group','${g.id}')">${g.icon} ${escapeHtml(g.name)}</div>`).join("");

  // Tags
  const tags = getAllTags();
  $("filterTags").innerHTML = `<div class="fchip ${!settings.filterTag ? "on" : ""}" onclick="setFilter('tag',null)">All</div>` +
    (tags.map(t => `<div class="fchip ${settings.filterTag === t ? "on" : ""}" onclick="setFilter('tag','${t}')">#${escapeHtml(t)}</div>`).join("") || '<span style="font-size:12px;color:var(--muted)">No tags</span>');

  // Dates
  const dates = [
    { id: null, label: "Any time" },
    { id: "today", label: "Today" },
    { id: "week", label: "This Week" },
    { id: "month", label: "This Month" }
  ];
  $("filterDates").innerHTML = dates.map(d =>
    `<div class="fchip ${settings.filterDate === d.id ? "on" : ""}" onclick="setFilter('date','${d.id || ""}')">${d.label}</div>`
  ).join("");

  $("filterSheetBg").classList.add("show");
};

window.setFilter = function (type, val) {
  if (type === "color") settings.filterColor = val;
  else if (type === "group") settings.filterGroup = val;
  else if (type === "tag") settings.filterTag = val;
  else if (type === "date") settings.filterDate = val || null;
  saveSettings();
  openFilterSheet();
  render();
};

window.clearAllFilters = function () {
  settings.filterColor = null;
  settings.filterGroup = null;
  settings.filterTag = null;
  settings.filterDate = null;
  settings.favOnly = false;
  $("filterBtn").classList.remove("on");
  saveSettings();
  closeSheet("filterSheetBg");
  render();
  toast("Filters cleared", "success");
};

// ═══════════════════════════════════════════
// GROUP EDITOR
// ═══════════════════════════════════════════
window.openGroupEditor = function (id) {
  currentGroupEdit = id ? groups.find(g => g.id === id) : null;
  $("groupEditorTitle").textContent = currentGroupEdit ? "Edit Group" : "New Group";
  $("groupName").value = currentGroupEdit ? currentGroupEdit.name : "";
  currentColor = currentGroupEdit ? currentGroupEdit.color : "#6366f1";
  renderGroupIconGrid(currentGroupEdit ? currentGroupEdit.icon : "📁");
  renderGroupColorSwatches();
  $("groupDeleteBtn").style.display = currentGroupEdit ? "block" : "none";
  $("groupEditorBg").classList.add("show");
};

let selectedGroupIcon = "📁";
function renderGroupIconGrid(selected) {
  selectedGroupIcon = selected || "📁";
  $("groupIconGrid").innerHTML = GROUP_ICONS.map(ic =>
    `<button class="${ic === selectedGroupIcon ? "on" : ""}" onclick="pickGroupIcon('${ic}')">${ic}</button>`
  ).join("");
}
window.pickGroupIcon = function (ic) {
  selectedGroupIcon = ic;
  renderGroupIconGrid(ic);
};
function renderGroupColorSwatches() {
  $("groupColors").innerHTML = COLORS.map(c =>
    `<div class="sw ${c === currentColor ? "on" : ""}" style="background:${c}" onclick="pickGroupColor('${c}')"></div>`
  ).join("");
}
window.pickGroupColor = function (c) { currentColor = c; renderGroupColorSwatches(); };

window.saveGroup = function () {
  const name = $("groupName").value.trim();
  if (!name) { toast("Group name required", "error"); return; }
  const snap = { notes, groups };
  if (currentGroupEdit) {
    currentGroupEdit.name = name;
    currentGroupEdit.icon = selectedGroupIcon;
    currentGroupEdit.color = currentColor;
    pushUndo("Group updated", snap);
  } else {
    groups.push({ id: "g_" + Date.now(), name, icon: selectedGroupIcon, color: currentColor });
    pushUndo("Group created", snap);
  }
  closeSheet("groupEditorBg");
  renderSidebar();
  renderEditorGroupSelect(currentGroupEdit ? currentGroupEdit.id : null);
  render();
  saveCloud();
  toast("Group saved", "success");
};

window.deleteCurrentGroup = function () {
  if (!currentGroupEdit) return;
  if (!confirm("Delete this group? Notes will be kept (no group).")) return;
  const snap = { notes, groups };
  const gid = currentGroupEdit.id;
  notes.forEach(n => { if (n.groupId === gid) n.groupId = null; });
  groups = groups.filter(g => g.id !== gid);
  pushUndo("Group deleted", snap);
  closeSheet("groupEditorBg");
  renderSidebar();
  render();
  saveCloud();
  toast("Group deleted", "success");
};

// ═══════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════
window.openStats = function () {
  const active = notes.filter(n => !n.deleted);
  const archived = notes.filter(n => n.archived);
  const trashed = notes.filter(n => n.deleted);
  const totalSize = new Blob([JSON.stringify(notes)]).size;
  const groupsCount = groups.length;
  const tags = getAllTags();
  const tagCount = tags.length;
  const attachments = notes.reduce((a, n) => a + (n.attachments || []).length, 0);
  const pinned = active.filter(n => n.pinned).length;
  const favs = active.filter(n => n.fav).length;
  const locked = active.filter(n => n.locked).length;

  // Activity last 7 days
  const now = Date.now();
  const week = 7 * 86400000;
  const recent = active.filter(n => new Date(n.updated || n.created).getTime() > now - week).length;

  $("statsBody").innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="val">${active.length}</div><div class="lbl">Total Notes</div></div>
      <div class="stat-card"><div class="val">${groupsCount}</div><div class="lbl">Groups</div></div>
      <div class="stat-card"><div class="val">${tagCount}</div><div class="lbl">Tags</div></div>
      <div class="stat-card"><div class="val">${attachments}</div><div class="lbl">Attachments</div></div>
      <div class="stat-card"><div class="val">${pinned}</div><div class="lbl">Pinned</div></div>
      <div class="stat-card"><div class="val">${favs}</div><div class="lbl">Favorites</div></div>
      <div class="stat-card"><div class="val">${locked}</div><div class="lbl">Locked</div></div>
      <div class="stat-card"><div class="val">${archived.length}</div><div class="lbl">Archived</div></div>
      <div class="stat-card"><div class="val">${trashed.length}</div><div class="lbl">In Bin</div></div>
      <div class="stat-card"><div class="val">${recent}</div><div class="lbl">This Week</div></div>
    </div>
    <div style="margin-top:16px">
      <div class="field"><label>Data Size</label><div>${fmtBytes(totalSize)}</div></div>
      <div class="field"><label>Last Sync</label><div>${window.lastSyncTime ? new Date(window.lastSyncTime).toLocaleString() : "—"}</div></div>
    </div>
    <div style="margin-top:16px">
      <div class="field"><label>Groups Breakdown</label></div>
      ${groups.map(g => {
        const cnt = active.filter(n => n.groupId === g.id).length;
        return `<div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>${g.icon} ${escapeHtml(g.name)}</span><strong>${cnt}</strong></div>`;
      }).join("") || '<div style="color:var(--muted);font-size:13px">No groups</div>'}
    </div>
  `;
  $("statsBg").classList.add("show");
};

// ═══════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════
window.openSettings = function () {
  const schemes = [
    { id: "indigo", label: "Indigo", colors: ["#6366f1", "#8b5cf6"] },
    { id: "ocean", label: "Ocean", colors: ["#0ea5e9", "#0369a1"] },
    { id: "sunset", label: "Sunset", colors: ["#f97316", "#be123c"] },
    { id: "forest", label: "Forest", colors: ["#10b981", "#065f46"] },
    { id: "rose", label: "Rose", colors: ["#ec4899", "#9d174d"] }
  ];
  const fonts = [
    { id: "system", label: "System", css: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" },
    { id: "roboto", label: "Roboto", css: "'Roboto', sans-serif" },
    { id: "poppins", label: "Poppins", css: "'Poppins', sans-serif" },
    { id: "inter", label: "Inter", css: "'Inter', sans-serif" },
    { id: "montserrat", label: "Montserrat", css: "'Montserrat', sans-serif" }
  ];
  $("settingsBody").innerHTML = `
    <div class="field">
      <label>🎨 Color Scheme</label>
      <div class="pick-row" style="padding-top:6px">
        ${schemes.map(s => `<div class="scheme-swatch ${settings.scheme === s.id ? "on" : ""}" style="background:linear-gradient(135deg,${s.colors[0]},${s.colors[1]})" onclick="setScheme('${s.id}')" title="${s.label}"></div>`).join("")}
      </div>
    </div>

    <div class="field">
      <label>🌓 Theme</label>
      <div class="pick-row" style="padding-top:6px">
        <div class="pick-item ${settings.theme === "light" ? "on" : ""}" onclick="setTheme('light')">☀️ Light</div>
        <div class="pick-item ${settings.theme === "dark" ? "on" : ""}" onclick="setTheme('dark')">🌙 Dark</div>
      </div>
    </div>

    <div class="field">
      <label>🔤 Font Family</label>
      <div class="pick-row" style="padding-top:6px">
        ${fonts.map(f => `<div class="pick-item ${settings.font === f.id ? "on" : ""}" style="font-family:${f.css}" onclick="setFont('${f.id}')">${f.label}</div>`).join("")}
      </div>
    </div>

    <div class="field">
      <label>📏 Font Size (${settings.fontSize}px)</label>
      <input type="range" min="13" max="20" value="${settings.fontSize}" oninput="setFontSize(this.value)" style="width:100%">
    </div>

    <div class="field">
      <label>⚡ Animation Speed</label>
      <div class="pick-row" style="padding-top:6px">
        <div class="pick-item ${settings.animSpeed === 1 ? "on" : ""}" onclick="setAnim(1)">Normal</div>
        <div class="pick-item ${settings.animSpeed === 0.5 ? "on" : ""}" onclick="setAnim(0.5)">Fast</div>
        <div class="pick-item ${settings.animSpeed === 2 ? "on" : ""}" onclick="setAnim(2)">Slow</div>
        <div class="pick-item ${settings.animSpeed === 0 ? "on" : ""}" onclick="setAnim(0)">Off</div>
      </div>
    </div>

    <div class="field">
      <label>👁 View Mode</label>
      <div class="pick-row" style="padding-top:6px">
        <div class="pick-item ${settings.viewMode === "list" ? "on" : ""}" onclick="setView('list')">📄 List</div>
        <div class="pick-item ${settings.viewMode === "grid" ? "on" : ""}" onclick="setView('grid')">📱 Grid</div>
      </div>
    </div>

    <div class="row-between">
      <span>Compact Mode</span>
      <div class="toggle ${settings.compact ? "on" : ""}" onclick="toggleCompact()"></div>
    </div>

    <div class="row-between">
      <span>Favorites only</span>
      <div class="toggle ${settings.favOnly ? "on" : ""}" onclick="toggleFavOnly()"></div>
    </div>

    <div style="height:20px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn-secondary" onclick="exportAllJSON()">📤 Export JSON</button>
      <button class="btn-secondary" onclick="exportAllPDF()">📄 Export PDF</button>
      <button class="btn-secondary" onclick="exportAllHTML()">🌐 Export HTML</button>
      <button class="btn-secondary" onclick="exportAllZIP()">📦 Export ZIP</button>
      <button class="btn-secondary" onclick="importJSON()">📥 Import JSON</button>
      <button class="btn-secondary" onclick="exportCSV()">📊 Export CSV</button>
    </div>

    <div style="height:20px"></div>
    <button class="btn-danger w-full" onclick="resetAll()">🗑 Reset All Data</button>
    <button class="btn-secondary w-full" style="margin-top:8px" onclick="signOutNow()">🚪 Sign Out</button>

    <div style="height:16px"></div>
    <div style="text-align:center;color:var(--muted);font-size:11px">
      Notes Pro · Firebase Edition<br>
      User: notemanager.app@gmail.com
    </div>
  `;
  $("settingsBg").classList.add("show");
};

window.setScheme = function (id) {
  settings.scheme = id;
  document.body.classList.remove("scheme-ocean", "scheme-sunset", "scheme-forest", "scheme-rose");
  if (id !== "indigo") document.body.classList.add("scheme-" + id);
  saveSettings();
  openSettings();
};

window.setTheme = function (t) {
  settings.theme = t;
  document.body.classList.toggle("dark", t === "dark");
  $("themeBtn") && ($("themeBtn").textContent = t === "dark" ? "☀️" : "🌙");
  saveSettings();
  openSettings();
};

window.setFont = function (id) {
  settings.font = id;
  const fonts = {
    system: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
    roboto: "'Roboto', sans-serif",
    poppins: "'Poppins', sans-serif",
    inter: "'Inter', sans-serif",
    montserrat: "'Montserrat', sans-serif"
  };
  document.documentElement.style.setProperty("--app-font", fonts[id] || fonts.system);
  saveSettings();
  openSettings();
};

window.setFontSize = function (v) {
  settings.fontSize = parseInt(v);
  document.documentElement.style.setProperty("--fs", v + "px");
  saveSettings();
};

window.setAnim = function (v) {
  settings.animSpeed = v;
  if (v === 0) document.body.classList.add("no-anim");
  else document.body.classList.remove("no-anim");
  document.documentElement.style.setProperty("--anim", (0.25 * v) + "s");
  saveSettings();
  openSettings();
};

window.setView = function (v) {
  settings.viewMode = v;
  saveSettings();
  render();
  openSettings();
};

window.toggleCompact = function () {
  settings.compact = !settings.compact;
  document.body.classList.toggle("compact", settings.compact);
  saveSettings();
  openSettings();
  render();
};

window.toggleFavOnly = function () {
  settings.favOnly = !settings.favOnly;
  $("filterBtn").classList.toggle("on", settings.favOnly);
  saveSettings();
  render();
  openSettings();
};

window.toggleTheme = function () {
  setTheme(settings.theme === "dark" ? "light" : "dark");
};

window.resetAll = function () {
  if (!confirm("⚠️ Delete ALL notes permanently? Cannot be undone.")) return;
  if (!confirm("Are you really sure? This will erase everything.")) return;
  const snap = { notes, groups };
  notes = [];
  pushUndo("All data reset", snap);
  render();
  saveCloud();
  closeSheet("settingsBg");
  toast("All data reset", "");
};

// ═══════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════
window.exportAllJSON = function () {
  const data = JSON.stringify({ notes, groups, exported: new Date().toISOString() }, null, 2);
  downloadBlob(data, "notes_pro_backup_" + dateStr() + ".json", "application/json");
  toast("Exported JSON", "success");
};

window.exportAllHTML = function () {
  let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Notes Export</title><style>body{font-family:Arial;max-width:800px;margin:auto;padding:20px;line-height:1.6}h1{border-bottom:2px solid #333;padding-bottom:8px}h2{color:#6366f1;margin-top:30px}.note{border:1px solid #ddd;padding:16px;margin:16px 0;border-radius:8px}.meta{color:#666;font-size:12px}</style></head><body><h1>Notes Export</h1><p class="meta">${new Date().toLocaleString()}</p>`;
  notes.filter(n => !n.deleted).forEach(n => {
    html += `<div class="note"><h2>${escapeHtml(n.title)}</h2><div class="meta">${new Date(n.updated || n.created).toLocaleString()}</div><hr>${n.content || ""}`;
    if (n.tags && n.tags.length) html += `<p class="meta">Tags: ${n.tags.map(t => "#" + escapeHtml(t)).join(" ")}</p>`;
    html += "</div>";
  });
  html += "</body></html>";
  downloadBlob(html, "notes_pro_" + dateStr() + ".html", "text/html");
  toast("Exported HTML", "success");
};

window.exportAllPDF = function () {
  if (!window.jspdf) { toast("PDF library not loaded", "error"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  let y = margin;
  doc.setFontSize(20); doc.setFont("helvetica", "bold");
  doc.text("Notes Export", margin, y); y += 24;
  doc.setFontSize(9); doc.setFont("helvetica", "normal"); doc.setTextColor(120);
  doc.text(new Date().toLocaleString(), margin, y); y += 20;
  doc.setTextColor(0);
  notes.filter(n => !n.deleted).forEach(n => {
    if (y > pageH - margin - 60) { doc.addPage(); y = margin; }
    doc.setFontSize(14); doc.setFont("helvetica", "bold");
    const titleLines = doc.splitTextToSize(n.title || "Untitled", pageW - margin * 2);
    doc.text(titleLines, margin, y); y += titleLines.length * 16 + 6;
    doc.setFontSize(10); doc.setFont("helvetica", "normal");
    const txt = stripTags(n.content).replace(/\s+/g, " ").trim();
    const lines = doc.splitTextToSize(txt || "(empty)", pageW - margin * 2);
    lines.forEach(l => {
      if (y > pageH - margin - 20) { doc.addPage(); y = margin; }
      doc.text(l, margin, y); y += 13;
    });
    if (n.tags && n.tags.length) {
      doc.setTextColor(120); doc.setFontSize(9);
      doc.text("Tags: " + n.tags.map(t => "#" + t).join(" "), margin, y); y += 12;
      doc.setTextColor(0);
    }
    y += 12;
  });
  doc.save("notes_pro_" + dateStr() + ".pdf");
  toast("Exported PDF", "success");
};

window.exportAllZIP = async function () {
  if (!window.JSZip) { toast("ZIP library not loaded", "error"); return; }
  toast("Building ZIP...");
  try {
    const zip = new JSZip();
    zip.file("data.json", JSON.stringify({ notes, groups }, null, 2));
    let htmlContent = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Notes</title></head><body>";
    notes.filter(n => !n.deleted).forEach(n => {
      htmlContent += `<h2>${escapeHtml(n.title)}</h2><div>${n.content || ""}</div><hr>`;
    });
    htmlContent += "</body></html>";
    zip.file("notes.html", htmlContent);
    const blob = await zip.generateAsync({ type: "blob" });
    downloadBlob(blob, "notes_pro_" + dateStr() + ".zip", "application/zip");
    toast("ZIP exported ✓", "success");
  } catch (e) {
    toast("ZIP failed: " + e.message, "error");
  }
};

window.exportCSV = function () {
  let csv = "Title,Group,Tags,Pinned,Favorite,Locked,Created,Updated,Words\n";
  notes.filter(n => !n.deleted).forEach(n => {
    const group = groups.find(g => g.id === n.groupId);
    csv += `"${(n.title || "").replace(/"/g, '""')}","${group ? group.name : ""}","${(n.tags || []).join("; ")}",${n.pinned},${n.fav},${n.locked},"${n.created}","${n.updated}",${stripTags(n.content).trim().split(/\s+/).length}\n`;
  });
  downloadBlob(csv, "notes_pro_" + dateStr() + ".csv", "text/csv");
  toast("Exported CSV", "success");
};

window.importJSON = function () {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.notes) throw new Error("Invalid format");
      if (!confirm("Import " + data.notes.length + " notes? This will replace your current notes.")) return;
      const snap = { notes, groups };
      notes = data.notes;
      groups = data.groups || [];
      pushUndo("Imported data", snap);
      render();
      saveCloud();
      closeSheet("settingsBg");
      toast("Imported ✓", "success");
    } catch (err) {
      toast("Import failed: " + err.message, "error");
    }
  };
  inp.click();
};

function downloadBlob(data, filename, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function dateStr() { return new Date().toISOString().slice(0, 10); }
// ═══════════════════════════════════════════
// FIREBASE — LOAD & SAVE
// ═══════════════════════════════════════════
async function loadCloud() {
  if (!currentUser) return;
  try {
    setSync("syncing");
    const ref = doc(db, COLL, currentUser.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const data = snap.data();
      notes = Array.isArray(data.notes) ? data.notes : [];
      groups = Array.isArray(data.groups) ? data.groups : [];
      if (data.settings) {
        Object.assign(settings, data.settings);
        applySettings();
      }
      window.lastSyncTime = data.updatedAt || null;
      console.log("Loaded", notes.length, "notes,", groups.length, "groups");
    } else {
      notes = [];
      groups = [];
      console.log("New user");
    }
    render();
    renderSidebar();
    setSync("online");
  } catch (e) {
    console.error("Load error:", e);
    setSync("offline");
    showErr("Load failed: " + e.message);
  }
}

async function saveCloud() {
  if (!currentUser || saving) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saving = true;
    setSync("syncing");
    try {
      await setDoc(doc(db, COLL, currentUser.uid), {
        notes,
        groups,
        settings,
        updatedAt: new Date().toISOString(),
        email: currentUser.email
      }, { merge: true });
      window.lastSyncTime = new Date().toISOString();
      setSync("online");
      toast("Saved ✓", "success");
    } catch (e) {
      console.error("Save error:", e);
      setSync("offline");
      showErr("Save failed: " + e.message);
      toast("Save failed", "error");
    } finally {
      saving = false;
    }
  }, 500);
}

function saveSettings() {
  try { localStorage.setItem("notes_pro_settings", JSON.stringify(settings)); } catch (e) {}
  saveCloud();
}

function applySettings() {
  // Theme
  document.body.classList.toggle("dark", settings.theme === "dark");
  const tb = $("themeBtn"); if (tb) tb.textContent = settings.theme === "dark" ? "☀️" : "🌙";
  // Scheme
  document.body.classList.remove("scheme-ocean", "scheme-sunset", "scheme-forest", "scheme-rose");
  if (settings.scheme && settings.scheme !== "indigo") document.body.classList.add("scheme-" + settings.scheme);
  // Font
  const fonts = {
    system: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
    roboto: "'Roboto', sans-serif",
    poppins: "'Poppins', sans-serif",
    inter: "'Inter', sans-serif",
    montserrat: "'Montserrat', sans-serif"
  };
  document.documentElement.style.setProperty("--app-font", fonts[settings.font] || fonts.system);
  // Font size
  document.documentElement.style.setProperty("--fs", (settings.fontSize || 15) + "px");
  // Animation
  if (settings.animSpeed === 0) document.body.classList.add("no-anim");
  document.documentElement.style.setProperty("--anim", (0.25 * (settings.animSpeed ?? 1)) + "s");
  // Compact
  document.body.classList.toggle("compact", !!settings.compact);
  // Theme color meta
  document.querySelector('meta[name="theme-color"]').content = settings.theme === "dark" ? "#0f172a" : "#6366f1";
}

window.reloadCloud = async function () {
  toast("Syncing...");
  await loadCloud();
  toast("Synced ✓", "success");
};

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
window.signOutNow = async function () {
  if (!confirm("Sign out?")) return;
  await signOut(auth);
  location.reload();
};

(async () => {
  try {
    setProgress(20, "Signing in...");
    try {
      await signInWithEmailAndPassword(auth, EMAIL, PASS);
      console.log("Signed in");
    } catch (e) {
      if (e.code === "auth/user-not-found" || e.code === "auth/invalid-credential") {
        setProgress(30, "Creating account...");
        await createUserWithEmailAndPassword(auth, EMAIL, PASS);
        console.log("Account created");
      } else throw e;
    }
    setProgress(50, "Loading notes...");
  } catch (e) {
    console.error("Auth failed:", e);
    setProgress(100, "Auth failed");
    showErr("Auth failed: " + e.message);
  }
})();

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    // Load local settings first
    try {
      const local = localStorage.getItem("notes_pro_settings");
      if (local) Object.assign(settings, JSON.parse(local));
    } catch (e) {}
    applySettings();
    await loadCloud();
    $("app").style.display = "block";
    $("fab").style.display = "flex";
    $("bottomNav").classList.add("show");
    hideLoader();
    render();
    renderSidebar();
    renderSortChips();
  }
});

setTimeout(() => {
  const l = $("loader");
  if (l && !l.classList.contains("hide")) {
    hideLoader();
    if (currentUser) {
      $("app").style.display = "block";
      $("fab").style.display = "flex";
      $("bottomNav").classList.add("show");
    }
  }
}, 8000);

// ═══════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === "s" && editingId) { e.preventDefault(); saveNote(); }
    if (e.key === "n") { e.preventDefault(); openEditor(); }
    if (e.key === "f") { e.preventDefault(); $("search").focus(); }
    if (e.key === "b" && document.execCommand) { document.execCommand("bold", false, null); }
  }
  if (e.key === "Escape") {
    if ($("editorBg").classList.contains("show")) closeEditor();
    else if ($("settingsBg").classList.contains("show")) closeSheet("settingsBg");
    else if ($("statsBg").classList.contains("show")) closeSheet("statsBg");
    else if ($("filterSheetBg").classList.contains("show")) closeSheet("filterSheetBg");
    else if ($("sortSheetBg").classList.contains("show")) closeSheet("sortSheetBg");
    else if ($("ctxMenu").classList.contains("show")) closeCtxMenu();
    else if (selectedIds.size > 0) clearSelection();
    else closeAllPanels();
  }
});

// ═══════════════════════════════════════════
// DISABLE PAGE ZOOM ON DOUBLE TAP
// ═══════════════════════════════════════════
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// ═══════════════════════════════════════════
// PREVENT ACCIDENTAL NAVIGATION
// ═══════════════════════════════════════════
window.addEventListener("beforeunload", e => {
  if (saving) {
    e.preventDefault();
    e.returnValue = "";
  }
});

// ═══════════════════════════════════════════
// INITIAL RENDER
// ═══════════════════════════════════════════
renderColors();
console.log("Notes Pro initialized — Firebase project:", firebaseConfig.projectId);
</script>
